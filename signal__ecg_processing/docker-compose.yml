services:
  ecg-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecg-pipeline-app:latest
    container_name: ecg-pipeline-app
    ports:
      - "8501:8501"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s